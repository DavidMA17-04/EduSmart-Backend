services:
  mysql:
    image: mysql:8.4
    container_name: edusmart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-EduSmart}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
    # Puerto del host: 3307 por defecto para no chocar con un MySQL local en 3306.
    # Para que el backend use este contenedor, ponga DB_PORT=3307 en backend/.env.
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - edusmart_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m

volumes:
  edusmart_mysql_data:
